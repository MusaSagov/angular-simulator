<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <label>Логин:</label>
  <input id="username" type="text" formControlName="username" required placeholder="Введите логин">
  <label>Пароль:</label>
  <input id="password" type="password" formControlName="password" required placeholder="Введите пароль">
  <button type="submit" [disabled]="form.invalid">Отправить</button>
</form>
