<p>products works!</p>
<div class="flex flex-wrap gap-3 mb-4">
  <input
    pInputText
    type="text"
    placeholder="Поиск..."
    [ngModel]="search()"
    (ngModelChange)="onSearchChange($event)"
    class="w-64"
  />
  <p-select
    [options]="categories()"
    optionLabel="label"
    optionValue="value"
    placeholder="Категория"
    [ngModel]="selectedCategory()"
    (ngModelChange)="selectCategory($event)"
    [showClear]="true"
  />
  <p-select
    [options]="sortFields"
    optionLabel="label"
    optionValue="value"
    placeholder="Сортировка"
    [ngModel]="sortField()"
    (ngModelChange)="onSortFieldChange($event)"
  />
  <p-select
    [options]="sortOrders"
    optionLabel="label"
    optionValue="value"
    placeholder="Порядок"
    [ngModel]="sortOrder()"
    (ngModelChange)="onSortOrderChange($event)"
  />
  <p-select
    [options]="pageSizes"
    optionLabel="label"
    optionValue="value"
    placeholder="На странице"
    [ngModel]="pageSize()"
    (ngModelChange)="changePageSize($event)"
  />
</div>
<div class="grid">
  @for (p of products(); track p.id) {
    <div class="col-12 md:col-6 lg:col-4 mb-4">
      <p-card [header]="p.title" [subheader]="p.category" styleClass="h-full">
        <ng-template pTemplate="header">
          <img [src]="p.thumbnail" [alt]="p.title" class="w-full" />
        </ng-template>
        <p class="m-0">{{ p.price | currency:'USD' }} • Рейтинг: {{ p.rating }} • На складе: {{ p.stock }}</p>
        <ng-template pTemplate="footer">
          <a [routerLink]="['/products', p.id]" pButton label="Подробнее" icon="pi pi-eye" class="mr-2"></a>
          <button pButton label="В корзину" icon="pi pi-shopping-cart" (click)="addToCart(p)"></button>
        </ng-template>
      </p-card>
    </div>
  } @empty {
      @for (i of [1,2,3,4,5,6]; track i) {
        <div class="col-12 md:col-6 lg:col-4 mb-4">
          <p-card styleClass="h-full">
            <ng-template pTemplate="header">
              <p-skeleton width="100%" height="200px" />
            </ng-template>
            <p-skeleton width="80%" />
            <p-skeleton width="60%" />
          </p-card>
        </div>
      }
    }
</div>
<p-paginator
  [first]="(page() - 1) * pageSize()"
  [rows]="pageSize()"
  [totalRecords]="total()"
  [rowsPerPageOptions]="[10, 20, 30]"
  (onPageChange)="changePage($event)"
  class="mt-4"
/>
